<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#6edbff"/>
      <stop offset="100%" stop-color="#3ec6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b0b"/>
  <text x="256" y="390" font-family="ui-rounded, 'Nunito', 'Comfortaa', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="420" fill="url(#grad)" filter="url(#glow)" text-anchor="middle">g</text>
</svg>
