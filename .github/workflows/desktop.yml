name: Desktop builds

env:
  # GitHub is retiring Node 20 for actions; run every action on Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which builds to make"
        type: choice
        options: [mac, windows, all]
        default: mac
  push:
    tags: ["v*"]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          mac='{"os":"macos-14","name":"mac-apple-silicon"},{"os":"macos-15-intel","name":"mac-intel"}'
          win='{"os":"windows-latest","name":"windows-x64"}'
          case "${{ inputs.platform || 'all' }}" in
            mac) list="$mac" ;;
            windows) list="$win" ;;
            *) list="$mac,$win" ;;
          esac
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # Build for the oldest macOS our dependencies allow (Big Sur, 2020) so older Macs can run it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
      - name: Install wreq (optional, for Grindr sign-in)
        continue-on-error: true
        run: pip install wreq
      - name: Build
        env:
          # Optional: shared map key, added to the app at build time. Never committed.
          GRIFFIES_AWS_MAP_KEY: ${{ secrets.GRIFFIES_AWS_MAP_KEY }}
          GRIFFIES_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pyinstaller desktop/griffies.spec --noconfirm

      - name: Check and record the oldest macOS this build runs on
        if: runner.os == 'macOS'
        run: |
          # Read the minimum OS from every binary in the app and use the highest as the app's stated minimum.
          min=$(find dist/Griffies.app -type f \( -perm -111 -o -name '*.so' -o -name '*.dylib' \) -print0 \
            | xargs -0 -I{} sh -c 'otool -l "{}" 2>/dev/null | awk "/LC_BUILD_VERSION/{f=1} f&&/minos/{print \$2; f=0} /LC_VERSION_MIN_MACOSX/{g=1} g&&/version/{print \$2; g=0}"' \
            | sort -t. -k1,1n -k2,2n | tail -1)
          min=${min:-11.0}
          echo "Oldest macOS supported by this build: $min"
          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" dist/Griffies.app/Contents/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string $min" dist/Griffies.app/Contents/Info.plist
          echo "### ${{ matrix.name }}: needs macOS $min or newer" >> "$GITHUB_STEP_SUMMARY"
          # Ad-hoc sign the whole bundle so Apple Silicon will launch it after the Info.plist edit.
          codesign --force --deep --sign - dist/Griffies.app
      - name: Package .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R dist/Griffies.app dmg/
          ln -s /Applications dmg/Applications
          cp desktop/FIRST-OPEN.txt "dmg/Read me first.txt"
          hdiutil create -volname Griffies -srcfolder dmg -ov -format UDZO "Griffies-${{ matrix.name }}.dmg"
      - name: Package .pkg installer
        if: runner.os == 'macOS'
        run: |
          VERSION=$(cat desktop/VERSION)
          pkgbuild --component dist/Griffies.app --install-location /Applications \
            --identifier com.ctrlaltorion.griffies --version "$VERSION" \
            "Griffies-${{ matrix.name }}.pkg"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = (Get-Content desktop/VERSION -Raw).Trim()
          & $iscc "/DAppVersion=$version" "/DOutName=Griffies-Setup-${{ matrix.name }}" desktop/griffies.iss
          Move-Item "desktop/Output/Griffies-Setup-${{ matrix.name }}.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: Griffies-${{ matrix.name }}
          path: |
            Griffies-*.dmg
            Griffies-*.pkg
            Griffies-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
